<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хроники Державы</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1.1 ГЛАВНОЕ МЕНЮ -->
<div id="menu-screen" class="screen active">
    <div class="menu-box">
        <h1>ХРОНИКИ ДЕРЖАВЫ</h1>
        <div class="select-group">
            <label for="era-select">Эпоха</label>
            <select id="era-select">
                <option value="0">Киевская Русь</option>
                <option value="1" disabled>Российская Империя (в разработке)</option>
                <option value="2" disabled>СССР (в разработке)</option>
            </select>
        </div>
        <div class="select-group">
            <label for="region-select">Регион</label>
            <select id="region-select">
                <option value="rus_region_1">Полянская земля</option>
            </select>
        </div>
        <div class="select-group">
            <label for="mission-select">Миссия</label>
            <select id="mission-select">
                <option value="mission_1">Глава 1: От села до рати</option>
            </select>
        </div>
        <button class="primary" onclick="Game.startMission()">Начать миссию</button>
    </div>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div id="game-screen" class="screen">
    <!-- 10.1 Верхняя панель -->
    <div id="top-bar">
        <div class="stat-item">
            <span class="stat-label">Провиант</span>
            <span class="stat-val" id="ui-provant">20</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Древесина</span>
            <span class="stat-val" id="ui-wood">10</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Крестьяне</span>
            <span class="stat-val" id="ui-workers">5/5</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">ПАТ / ПАС</span>
            <span class="stat-val" id="ui-pat-pas">50% / 50%</span>
        </div>
        <div class="stat-item" id="timer-box">
            <span class="stat-label">Таймер</span>
            <span class="stat-val" id="ui-timer">10:00</span>
        </div>
    </div>

    <!-- 1.3 Карта миссии -->
    <div id="map-container">
        <canvas id="map-canvas"></canvas>
        <div id="toast-container"></div>
    </div>

    <!-- 10.2 Нижняя панель -->
    <div id="bottom-bar">
        <button class="nav-btn" onclick="UI.closeAllModals()">Карта</button>
        <button class="nav-btn" onclick="UI.openTasks()">Задания</button>
        <button class="nav-btn" onclick="UI.openSettings()">Настройки</button>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <span id="modal-title">Заголовок</span>
            <button class="close-btn" onclick="UI.closeAllModals()">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
