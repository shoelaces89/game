<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Историческая игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

    <!-- HUD -->
    <div id="hud">
        <div class="hud-left">
            <button id="menu-btn" onclick="toggleMenu()">☰</button>
        </div>
        <div class="hud-res">
            <span>🍞 <b id="r-food">0</b></span>
            <span>🪵 <b id="r-wood">0</b></span>
            <span>🪙 <b id="r-gold">0</b></span>
        </div>
    </div>

    <!-- Выпадающее меню -->
    <div id="menu-panel">
        <button class="menu-item" onclick="showSettings()">⚙️ Настройки</button>
        <button class="menu-item" onclick="showSave()">💾 Сохранить</button>
        <button class="menu-item" onclick="showExit()">🚪 Выход</button>
    </div>

    <!-- ЭКРАН 1: ЭПОХА -->
    <div class="screen active" id="screen-era">
        <div id="era-map">
            <div id="era-swipe-hint">← свайп →</div>
            <div id="era-title">Эпоха 1: Киевская Русь</div>
            <div id="era-regions"></div>
        </div>
    </div>

    <!-- ЭКРАН 2: РЕГИОН -->
    <div class="screen" id="screen-region">
        <div id="region-info-bar" onclick="toggleRegionInfo()">
            <span id="region-info-short">Киевская земля · 0/5 миссий</span>
            <span id="region-info-toggle">▼</span>
        </div>
        <div id="region-info-full">
            <p>Регион «Киевская земля». Начни с малого — построй базу и разведай окрестности.</p>
        </div>
        <div id="region-missions"></div>
    </div>

    <!-- ЭКРАН 3: МИССИЯ (КАРТА) -->
    <div class="screen" id="screen-mission">
        <div id="mission-task">
            <span id="mission-task-text">—</span>
        </div>
        <div id="mission-map-wrapper">
            <div id="mission-map"></div>
        </div>
        <button class="btn btn-back" onclick="backToRegion()">← Назад к региону</button>
    </div>

    <!-- ЭКРАН 4: ПОЛЕ -->
    <div class="screen" id="screen-field">
        <div class="mini-header">
            <button class="btn btn-small" onclick="backToMission()">← Назад</button>
            <span>🌾 Поле</span>
        </div>
        <div id="field-grid"></div>
        <div id="field-export" class="export-zone">
            <span>🚚 Зона вывоза</span>
        </div>
        <div id="field-panel"></div>
    </div>

    <!-- ЭКРАН 5: ЛЕС -->
    <div class="screen" id="screen-forest">
        <div class="mini-header">
            <button class="btn btn-small" onclick="backToMission()">← Назад</button>
            <span>🌲 Лес</span>
        </div>
        <div id="forest-grid"></div>
        <div id="forest-export" class="export-zone">
            <span>🚚 Зона вывоза</span>
        </div>
        <div id="forest-panel"></div>
    </div>

    <!-- ПАНЕЛЬ ДЕЙСТВИЙ -->
    <div id="action-panel">
        <div id="action-title"></div>
        <div id="action-buttons"></div>
        <button class="btn btn-close" onclick="closeActionPanel()">Отмена</button>
    </div>

    <!-- МОДАЛКА -->
    <div id="modal">
        <div id="modal-content">
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
            <button class="btn btn-close" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <!-- ЛОГ -->
    <div id="log"></div>

</div>

<script src="index.js"></script>
</body>
</html>
